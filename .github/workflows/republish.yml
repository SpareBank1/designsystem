name: Republish

# Publishes versions that are already bumped and tagged on main but never made it
# to npm, typically because Sigstore aborted the signing of a few packages.
# Does not bump versions — `from-package` only publishes what the registry lacks.
on:
    workflow_dispatch:

jobs:
    republish:
        name: Publish missing package versions from main
        runs-on: ubuntu-latest
        permissions:
            id-token: write # Required for OIDC
            contents: read
        steps:
            # Jobben publiserer bare til npm og pusher ingenting, så den trenger
            # verken PAT eller git-credentials liggende på disk. Derfor står den
            # heller ikke i artipacked-unntakene i .github/zizmor.yml.
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: '0'
                  ref: 'main'
                  persist-credentials: false

            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 24
                  registry-url: 'https://registry.npmjs.org'

            - run: |
                  npm ci --ignore-scripts
                  echo "$GITHUB_WORKSPACE/node_modules/.bin/" >> $GITHUB_PATH

            # Packages publish build output, so the tarballs must be rebuilt here.
            - name: Build packages
              run: npm run build

            - name: lerna publish to registry.npmjs.org
              id: publish
              continue-on-error: true
              run: lerna publish from-package --yes

            - name: Retry publish of remaining packages
              if: ${{ steps.publish.outcome == 'failure' }}
              run: lerna publish from-package --yes

            - name: Verify all versions reached npm
              run: node scripts/verify-published-versions.js
