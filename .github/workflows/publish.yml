name: Publish

on:
    push:
        branches:
            - main
    # Kjøres manuelt for å publisere versjoner som ligger på main, men mangler på
    # npm, uten å bumpe. Det må skje fra denne fila, fordi trusted publishing på
    # npm bare godtar publish.yml.
    workflow_dispatch:

# En manuell kjøring skal ikke publisere samtidig med en release.
concurrency:
    group: publish
    cancel-in-progress: false

jobs:
    publish:
        name: Build and publish npm packages with lerna
        runs-on: ubuntu-latest
        permissions:
            id-token: write # Required for OIDC
            contents: read
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: '0'
                  ref: 'main'
                  # Use personnel access token for bot account
                  token: ${{ secrets.GH_USER_PAT }}

            - name: git config user
              run: |
                  git config user.email "designsystem@sparebank1.no"
                  git config user.name "sb1-designsystem"

            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 24
                  registry-url: 'https://registry.npmjs.org'

            - run: |
                  npm ci --ignore-scripts
                  echo "$GITHUB_WORKSPACE/node_modules/.bin/" >> $GITHUB_PATH

            # Gjør en 409 fra Rekor ufarlig ved å hente oppføringen som allerede
            # er lagret. Se kommentaren i skriptet.
            - name: Patch sigstore to fetch existing Rekor entries on conflict
              run: node scripts/patch-sigstore-fetch-on-conflict.js

            - name: lerna changed
              id: lerna-changed
              run: echo "CHANGED_COUNT=$(lerna changed|wc -l)" >> $GITHUB_OUTPUT

            # En manuell kjøring publiserer koden på main under versjonen som står i
            # package.json. Det er bare riktig når ingen pakker er endret siden siste
            # release, ellers havner ny kode under en gammel versjon.
            - name: Check that main matches the last release
              if: ${{ github.event_name == 'workflow_dispatch' && steps.lerna-changed.outputs.CHANGED_COUNT > 0 }}
              run: |
                  echo "::error::main har pakkeendringer som ikke er releaset. Vent på neste release i stedet."
                  exit 1

            - name: Build packages
              if: ${{ github.event_name == 'push' && steps.lerna-changed.outputs.CHANGED_COUNT > 0 }}
              run: |
                  npm run lint
                  npm run build
                  npm test -- --ci

            # Pakkene publiserer byggresultatet, så tarballene må bygges på nytt.
            - name: Build packages for republish
              if: ${{ github.event_name == 'workflow_dispatch' }}
              run: npm run build

            - name: lerna version
              id: version
              if: ${{ github.event_name == 'push' && steps.lerna-changed.outputs.CHANGED_COUNT > 0 }}
              run: lerna version --yes --force-git-tag --create-release github --force-publish
              env:
                  GH_TOKEN: ${{ secrets.GH_USER_PAT }}

            # Hvis noen pakker likevel feiler, plukker et nytt forsøk opp restene:
            # `from-package` publiserer bare versjoner som mangler på registry.
            # https://github.com/sigstore/sigstore-js/issues/1708
            - name: lerna publish to registry.npmjs.org
              id: publish
              if: ${{ steps.version.outcome == 'success' || github.event_name == 'workflow_dispatch' }}
              continue-on-error: true
              shell: bash
              run: lerna publish from-package --yes 2>&1 | tee -a "$RUNNER_TEMP/publish.log"

            # Lerna skriver gitHead inn i package.json under publisering og rydder
            # ikke opp når den feiler. Uten reset avbryter retryen med EUNCOMMIT.
            - name: Retry publish of remaining packages
              if: ${{ steps.publish.outcome == 'failure' }}
              shell: bash
              run: |
                  git checkout -- .
                  lerna publish from-package --yes 2>&1 | tee -a "$RUNNER_TEMP/publish.log"

            # Versjonsbumpen ligger allerede på main, så develop skal følge med
            # selv om publiseringen feiler. Manglende pakker repareres ved å kjøre
            # denne workflowen manuelt.
            - name: Merge back changes to development branch
              if: ${{ !cancelled() && steps.version.outcome == 'success' }}
              run: |
                  git checkout -- .
                  git checkout develop
                  git pull
                  git merge -X theirs --no-edit main
                  git push origin develop
                  git push --tags

            - name: Verify lerna published every package
              if: ${{ !cancelled() && (steps.version.outcome == 'success' || github.event_name == 'workflow_dispatch') }}
              run: node scripts/verify-published-versions.js "$RUNNER_TEMP/publish.log"

            - name: Build storybook
              if: ${{ steps.version.outcome == 'success' }}
              run: |
                  npm run build
                  npm run build-storybook

            - name: Deploy storybook as gh-pages
              if: ${{ steps.version.outcome == 'success' }}
              uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
              with:
                  folder: storybook-static
                  branch: gh-pages
                  token: ${{ secrets.GH_USER_PAT }}
