name: Build CI

on:
    workflow_dispatch:
    pull_request:
        branches:
            - develop

permissions:
    contents: read

jobs:
    test-ci:
        name: Build, test, and deploy preview of components
        runs-on: ubuntu-latest
        if: github.event.repository.full_name == 'SpareBank1/designsystem'
        steps:
            - name: Checkout code
              uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
              with:
                  persist-credentials: false
            - name: Setup Node.js
              uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
              with:
                  node-version: 24
            - name: Install dependencies
              run: npm ci --ignore-scripts
            - name: Lint
              run: npm run lint
            - name: Build
              run: npm run build
            - name: Test
              run: npm test -- --ci
            - name: Build component overview page
              if: ${{ !github.event.pull_request.head.repo.fork }}
              run: npm run build-storybook
              env:
                  GH_PUBLIC_URL: /
            - name: Build and deploy preview
              if: ${{ !github.event.pull_request.head.repo.fork }}
              uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
              with:
                  azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_BLACK_BEACH_0D62D0D03 }}
                  repo_token: ${{ secrets.GITHUB_TOKEN }}
                  action: 'upload'
                  app_location: './storybook-static'
                  api_location: ''
                  output_location: ''
                  skip_app_build: true
