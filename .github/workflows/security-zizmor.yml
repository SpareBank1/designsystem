name: Sikkerhet - Zizmor workflow-skanning

on:
    pull_request:
        paths:
            - '.github/workflows/**'
            - '.github/zizmor.yml'
    push:
        branches:
            - develop
        paths:
            - '.github/workflows/**'
            - '.github/zizmor.yml'
    workflow_dispatch:

permissions:
    contents: read

jobs:
    scan:
        name: Scan workflows
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - name: Checkout code
              uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
              with:
                  persist-credentials: false

            - name: Kjør Zizmor sikkerhetsscanning
              run: |
                  docker run --rm --network none \
                    -v "${PWD}/.github:/repo/.github" \
                    ghcr.io/zizmorcore/zizmor:1.24.1 \
                    --offline --config /repo/.github/zizmor.yml /repo
