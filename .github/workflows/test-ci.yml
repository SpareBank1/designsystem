name: Test CI

on:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    test-ci:
        name: Build, test, and deploy preview of components
        runs-on: ubuntu-latest
        if: github.event.repository.full_name == 'SpareBank1/designsystem'
        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - name: Setup Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 24
            - name: Install dependencies
              run: npm ci --ignore-scripts
            - name: Lint
              run: npm run lint
            - name: Build
              run: npm run build
            - name: Test
              run: npm test -- --ci
            - name: Build component overview page
              if: ${{ !github.event.pull_request.head.repo.fork }}
              run: npm run build-storybook
              env:
                  GH_PUBLIC_URL: /
            - name: Build and deploy preview
              if: ${{ !github.event.pull_request.head.repo.fork }}
              uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
              with:
                  azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_BLACK_BEACH_0D62D0D03 }}
                  repo_token: ${{ secrets.GITHUB_TOKEN }}
                  action: 'upload'
                  app_location: './storybook-static'
                  api_location: ''
                  output_location: ''
                  skip_app_build: true
